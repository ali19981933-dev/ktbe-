<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الكتب الرسمية والأرشيف - قسم الحسابات</title>
    <!-- مكتبة Bootstrap 5 للتصميم -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- مكتبة FontAwesome للآقكونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة التعرف الضوئي على النصوص (OCR) للكتب القديمة -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Cairo', Tahoma, sans-serif;
        }
        .sidebar {
            background-color: #1e293b;
            color: #fff;
            min-height: 100vh;
        }
        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #0f172a;
            color: #fff;
        }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 10px;
        }
        .ocr-box {
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <!-- الشريط الجانبي -->
            <div class="col-md-3 col-lg-2 sidebar p-3 d-none d-md-block">
                <h4 class="text-center text-light mb-4"><i class="fas fa-archive"></i> الأرشيف الرقمي</h4>
                <hr class="text-secondary">
                <nav class="nav flex-column">
                    <a href="#" class="active"><i class="fas fa-home"></i> الرئيسية</a>
                    <a href="#"><i class="fas fa-file-alt"></i> إدخال كتاب جديد</a>
                    <a href="#"><i class="fas fa-folder-open"></i> أرشيف الكتب القديمة</a>
                    <a href="#"><i class="fas fa-calculator"></i> الحسابات والمالية</a>
                    <a href="#"><i class="fas fa-cog"></i> الإعدادات</a>
                </nav>
            </div>

            <!-- المحتوى الرئيسي -->
            <div class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-file-invoice text-primary"></i> إدارة وأرشفة الكتب الرسمية</h1>
                    <span class="badge bg-success p-2">هيئة استثمار البصرة - قسم الحسابات</span>
                </div>

                <!-- قسم الرفع الذكي للكتب القديمة (الميزة الجديدة) -->
                <div class="card mb-4 border-primary">
                    <div class="card-header bg-primary text-white">
                        <i class="fas fa-magic"></i> الأرشفة السريعة للكتب القديمة (الاستخراج الذكي للبيانات)
                    </div>
                    <div class="card-body">
                        <div class="ocr-box">
                            <label for="oldBookScan" class="form-label fw-bold text-dark mb-2">
                                <i class="fas fa-cloud-upload-alt fa-2x text-primary mb-2 d-block"></i>
                                اختر صورة أو ملف PDF للكتاب القديم ليقوم النظام باستخراج (الرقم، التاريخ، والموضوع) تلقائياً:
                            </label>
                            <input type="file" class="form-control w-75 mx-auto" id="oldBookScan" accept="image/*,application/pdf">
                            <div id="ocrStatus" class="form-text mt-2 text-muted fw-bold">يدعم النظام قراءة النصوص العربية والإنجليزية بدقة عالية.</div>
                        </div>
                    </div>
                </div>

                <!-- نموذج إدخال أو تعديل الكتاب -->
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <i class="fas fa-edit"></i> تفاصيل الكتاب الرسمي
                    </div>
                    <div class="card-body">
                        <form id="bookForm">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label for="bookNumber" class="form-label">رقم الكتاب / الصادر أو الوارد</label>
                                    <input type="text" class="form-control" id="bookNumber" placeholder="أدخل الرقم أو سيتم تعبئته تلقائياً">
                                </div>
                                <div class="col-md-4">
                                    <label for="bookDate" class="form-label">تاريخ الكتاب</label>
                                    <input type="text" class="form-control" id="bookDate" placeholder="YYYY/MM/DD">
                                </div>
                                <div class="col-md-4">
                                    <label for="bookType" class="form-label">نوع الكتاب</label>
                                    <select class="form-select" id="bookType">
                                        <option value="صادر">صادر</option>
                                        <option value="وارد">وارد</option>
                                        <option value="داخلي">داخلي (حسابات)</option>
                                        <option value="أرشيف قديم" selected>أرشيف
